name: StickTp
version: '${project.version}'
main: com.amirrori.sticktp.StickTp
api-version: "1.20"
authors: [ Amirrori ]
description: Teleports you to the block you're pointing at with a stick.
commands:
  magicstick:
    description: Gives you a magic stick.
    usage: /<command>
    permission: sticktp.magicstick
permissions:
  sticktp.magicstick:
    description: Allows /magicstick.
    default: op
  sticktp.use:
    description: Allows teleporting with the magic stick.
    default: true
